# servers/minecraft/docker-compose.yml
version: '3.8'

services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      VERSION: "1.20.4"
      MOTD: "Servidor de teste via painel!"
      ENABLE_COMMAND_BLOCK: "true"
      MAX_PLAYERS: 10
    volumes:
      - ./data:/data
    restart: unless-stopped
